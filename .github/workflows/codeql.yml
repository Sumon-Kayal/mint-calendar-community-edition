name: "CodeQL"

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '19 3 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (C)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Add GTK4/libadwaita backport PPA and install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common build-essential devscripts equivs
          sudo add-apt-repository -y ppa:savoury1/gtk4
          sudo apt-get update
          sudo mk-build-deps --install --remove \
            --tool="apt-get -o Debug::pkgProblemResolver=yes -y --no-install-recommends" \
            debian/control

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build
        run: |
          meson setup builddir
          ninja -C builddir

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          category: "/language:c-cpp"
