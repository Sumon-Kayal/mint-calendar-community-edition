# Builds a native .deb inside a Linux Mint container and publishes it as a real GitHub
# Release via `gh`. See debian/changelog and BUILD.md for why this tree needs newer
# GTK4/libadwaita than Mint 22's own repos ship (gtk4 >= 4.21.2, libadwaita >= 1.8~alpha
# vs Mint 22's default 4.14.5 / 1.5.0) — that gap is real and unrelated to this workflow's
# own steps. It's addressed below via ppa:savoury1/gtk4, a long-running, actively
# maintained third-party backport PPA for exactly this situation (see BUILD.md for why
# this PPA specifically, and for how to verify it before relying on it). If
# `mk-build-deps` still fails to resolve libadwaita/gtk4/blueprint-compiler after the
# PPA step, that PPA's currently-published versions are the first thing to check — this
# workflow can't guarantee a third-party PPA's contents ahead of time.

name: Build & Release (.deb)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: "Build .deb (Mint 22 / Ubuntu 24.04 base)"
    runs-on: ubuntu-latest
    container:
      image: linuxmintd/mint22-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential devscripts equivs software-properties-common

      - name: Add GTK4/libadwaita backport PPA (ppa:savoury1/gtk4)
        run: |
          add-apt-repository -y ppa:savoury1/gtk4
          apt-get update

      - name: Install build dependencies from debian/control
        run: |
          mk-build-deps --install --remove \
            --tool="apt-get -o Debug::pkgProblemResolver=yes -y --no-install-recommends" \
            debian/control

      - name: Build binary package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect .deb
        run: |
          mkdir -p dist
          mv ../*.deb dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mint-calendar-community-edition-deb
          path: dist/*.deb

  release:
    name: "Publish native GitHub Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download .deb
        uses: actions/download-artifact@v7
        with:
          name: mint-calendar-community-edition-deb
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.deb \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
