name: Build & Release (.deb)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: "Build .deb (Mint 22 / Ubuntu 24.04 base)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: inuxmintd/mint22-amd64@sha256:2526e6894bc3dd3a064c343b1c406868c546812b47162f2a7f2fae6d0cfcd99b # latest (as of pinning)
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential devscripts equivs software-properties-common

      - name: Add GTK4/libadwaita backport PPA (ppa:savoury1/gtk4)
        run: |
          add-apt-repository -y ppa:savoury1/gtk4
          apt-get update

      - name: Install build dependencies from debian/control
        run: |
          mk-build-deps --install --remove \
            --tool="apt-get -o Debug::pkgProblemResolver=yes -y --no-install-recommends" \
            debian/control

      - name: Build binary package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect .deb
        run: |
          mkdir -p dist
          mv ../*.deb dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mint-calendar-community-edition-deb
          path: dist/*.deb

  release:
    name: "Publish native GitHub Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download .deb
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mint-calendar-community-edition-deb
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.deb \
          RELEASE_TAG: $RELEASE_TAG" dist/*.deb \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
