# Same approach as before: build a native .deb inside a Linux Mint container and
# publish it as a real GitHub Release via `gh`. See debian/changelog and README
# for why this tree now needs newer GTK4/libadwaita than Mint's own 48.1+mint1 —
# that mismatch is the main open risk with this workflow, not anything in the CI
# steps themselves. If `mk-build-deps` fails to resolve libadwaita/gtk4/blueprint-
# compiler, that's this risk surfacing, not a workflow bug.

name: Build & Release (.deb)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: "Build .deb (Mint 22 / Ubuntu 24.04 base)"
    runs-on: ubuntu-latest
    container:
      image: linuxmintd/mint22-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential devscripts equivs

      - name: Install build dependencies from debian/control
        run: |
          mk-build-deps --install --remove \
            --tool="apt-get -o Debug::pkgProblemResolver=yes -y --no-install-recommends" \
            debian/control

      - name: Build binary package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect .deb
        run: |
          mkdir -p dist
          mv ../*.deb dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: mint-calendar-community-edition-deb
          path: dist/*.deb

  release:
    name: "Publish native GitHub Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download .deb
        uses: actions/download-artifact@v7
        with:
          name: mint-calendar-community-edition-deb
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.deb \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
